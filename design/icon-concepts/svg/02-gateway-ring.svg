<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 512 512" role="img" aria-label="网关之门">
<defs>
<radialGradient id="bg" cx="0.5" cy="0.45" r="0.75">
  <stop offset="0" stop-color="#18233F"/>
  <stop offset="1" stop-color="#060910"/>
</radialGradient>
<linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#22D3EE"/>
  <stop offset="0.55" stop-color="#818CF8"/>
  <stop offset="1" stop-color="#C084FC"/>
</linearGradient>
<linearGradient id="arrow" x1="0" y1="0" x2="0.3" y2="1">
