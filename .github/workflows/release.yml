name: Release desktop app

# Releases are always started by hand: either run this workflow from the Actions
# tab ("Run workflow") or push a v* tag. Everything builds into a draft release;
# unless "publish" is chosen the draft waits for a manual Publish on GitHub.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（例如 1.0.2）。留空表示沿用仓库中的当前版本"
        required: false
        default: ""
      publish:
        description: "构建完成后是否立即发布（draft 只生成草稿，随后在 GitHub 页面手动 Publish）"
        required: true
        default: draft
        type: choice
        options:
          - draft
          - publish
      platforms:
        description: "构建平台"
        required: true
        default: windows+macos
        type: choice
        options:
          - windows+macos
          - all
          - windows
          - macos
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.release.outputs.should_build }}
      version: ${{ steps.version.outputs.version }}
      publish_mode: ${{ steps.version.outputs.publish_mode }}
      platforms: ${{ steps.version.outputs.platforms }}
      matrix: ${{ steps.version.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release author
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          if [[ "${GITHUB_ACTOR}" != "${REPOSITORY_OWNER}" ]]; then
            echo "Only ${REPOSITORY_OWNER} may publish a release" >&2
            exit 1
          fi

      - name: Verify updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is not configured" >&2
            echo "Add the minisign private key to Settings → Secrets and variables → Actions." >&2
            exit 1
          fi

      - name: Read and verify app version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ github.event.inputs.version }}
          REQUESTED_PUBLISH: ${{ github.event.inputs.publish }}
          REQUESTED_PLATFORMS: ${{ github.event.inputs.platforms }}
        run: |
          repo_version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          package_version=$(node -p "require('./apps/desktop/package.json').version")
          cargo_version=$(sed -n '/^version = / { s/version = "\([^"]*\)"/\1/p; q; }' apps/desktop/src-tauri/Cargo.toml)
          test "${repo_version}" = "${package_version}"
          test "${repo_version}" = "${cargo_version}"

          if [[ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]]; then
            version="${REQUESTED_VERSION#v}"
            if [[ -z "${version}" ]]; then
              version="${repo_version}"
            fi
            if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "Invalid version '${version}'; expected something like 1.0.2" >&2
              exit 1
            fi
            case "${REQUESTED_PUBLISH}" in
              publish) publish_mode="release" ;;
              *) publish_mode="draft" ;;
            esac
            case "${REQUESTED_PLATFORMS}" in
              all) platforms="windows+macos+linux" ;;
              windows) platforms="windows" ;;
              macos) platforms="macos" ;;
              *) platforms="windows+macos" ;;
            esac
            echo "Manual release ${version} (${publish_mode}), platforms: ${platforms}"
          else
            version="${repo_version}"
            if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
              echo "Tag ${GITHUB_REF_NAME} does not match the app version v${version}" >&2
              exit 1
            fi
            git fetch origin main:refs/remotes/origin/main
            if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
              echo "Release tag must point to a commit contained in origin/main" >&2
              exit 1
            fi
            publish_mode="release"
            platforms="windows+macos+linux"
            echo "Tag release ${version} (release), platforms: ${platforms}"
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "publish_mode=${publish_mode}" >> "${GITHUB_OUTPUT}"
          echo "platforms=${platforms}" >> "${GITHUB_OUTPUT}"

          matrix=$(
            PLATFORMS="${platforms}" node -e '
              const wanted = (process.env.PLATFORMS ?? "").split("+");
              const rows = [];
              if (wanted.includes("windows")) {
                rows.push({ platform: "windows-x86_64", group: "windows", os: "windows-latest", args: "--bundles nsis", target: "" });
              }
              if (wanted.includes("macos")) {
                rows.push(
                  { platform: "macos-aarch64", group: "macos", os: "macos-15", args: "--target aarch64-apple-darwin", target: "aarch64-apple-darwin" },
                  { platform: "macos-x86_64", group: "macos", os: "macos-15-intel", args: "--target x86_64-apple-darwin", target: "x86_64-apple-darwin" },
                );
              }
              if (wanted.includes("linux")) {
                rows.push({ platform: "linux-x86_64", group: "linux", os: "ubuntu-22.04", args: "", target: "" });
              }
              process.stdout.write(JSON.stringify({ include: rows }));
            '
          )
          echo "Building: ${matrix}"
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"

      - name: Check whether this version is already published
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          state=$(gh release view "v${VERSION}" --json isDraft --jq 'if .isDraft then "draft" else "published" end' 2>/dev/null || true)
          if [[ "${state}" = "published" ]]; then
            echo "Version ${VERSION} is already published; nothing to do."
            echo "should_build=false" >> "${GITHUB_OUTPUT}"
          else
            echo "should_build=true" >> "${GITHUB_OUTPUT}"
          fi

  publish:
    name: Build (${{ matrix.platform }})
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.group == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Apply release version
        run: node .github/scripts/apply-version.mjs "${{ needs.prepare.outputs.version }}"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Rust target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.group == 'macos' && '-' || '' }}
        with:
          projectPath: apps/desktop
          tagName: v__VERSION__
          releaseName: Cursor BYOK v__VERSION__
          releaseBody: ${{ contains(needs.prepare.outputs.version, '-') && 'Beta release. Download the installer for your platform from the assets below.' || 'Download the installer for your platform from the assets below.' }}
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          args: ${{ matrix.args }}

      - name: Package legacy Linux updater asset
        if: matrix.group == 'linux'
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p legacy-update
          tar -czf "legacy-update/cursor-byok-${VERSION}-linux-amd64.tar.gz" -C target/release cursor-byok-desktop

      - name: Package and sign legacy Windows updater asset
        if: matrix.group == 'windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          New-Item -ItemType Directory -Force legacy-update | Out-Null
          $asset = "legacy-update/cursor-byok-$env:VERSION-windows-amd64.zip"
          Compress-Archive -LiteralPath target/release/cursor-byok-desktop.exe -DestinationPath $asset
          Push-Location apps/desktop
          npm exec tauri signer sign -- "../../$asset"
          Pop-Location
          $entries = @(tar -tf $asset)
          if ($entries.Count -ne 1 -or [System.IO.Path]::GetFileName($entries[0]) -ne 'cursor-byok-desktop.exe') {
            throw "Windows updater archive must contain only cursor-byok-desktop.exe"
          }
          if (!(Test-Path "$asset.sig")) {
            throw "Windows updater archive signature was not generated"
          }

      - name: Package legacy macOS updater asset
        if: matrix.group == 'macos'
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p legacy-update
          archive=$(find "target/${{ matrix.target }}/release/bundle/macos" -maxdepth 1 -name '*.app.tar.gz' -print -quit)
          test -n "${archive}"
          legacy_platform=macos-arm64
          if [[ "${{ matrix.platform }}" = "macos-x86_64" ]]; then
            legacy_platform=macos-amd64
          fi
          cp "${archive}" "legacy-update/cursor-byok-${VERSION}-${legacy_platform}.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: legacy-update-${{ matrix.platform }}
          path: legacy-update/*
          if-no-files-found: error

  finalize:
    name: Finalize release
    needs: [prepare, publish]
    if: needs.prepare.outputs.should_build == 'true' && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: legacy-update-*
          path: legacy-update
          merge-multiple: true

      - name: Generate legacy update manifest
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          node .github/scripts/generate-legacy-update.mjs \
            --version "${VERSION}" \
            --repository "${GITHUB_REPOSITORY}" \
            --assets-dir legacy-update \
            --output legacy-update/update.json \
            --notes "Cursor BYOK v${VERSION}"

      - name: Generate signed Windows portable update manifest
        if: contains(needs.prepare.outputs.platforms, 'windows')
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          asset="cursor-byok-${VERSION}-windows-amd64.zip"
          test -f "legacy-update/${asset}"
          test -f "legacy-update/${asset}.sig"
          node .github/scripts/generate-portable-update.mjs \
            --version "${VERSION}" \
            --repository "${GITHUB_REPOSITORY}" \
            --asset "${asset}" \
            --signature "legacy-update/${asset}.sig" \
            --output legacy-update/portable-latest.json

      - name: Normalize Tauri updater download URLs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p tauri-update
          release_id=$(
            gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"v${VERSION}\") | .id"
          )
          test -n "${release_id}"
          gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" > tauri-update/release.json
          asset_id=$(node -p 'require("./tauri-update/release.json").assets.find(({ name }) => name === "latest.json")?.id ?? ""')
          test -n "${asset_id}"
          gh api \
            -H "Accept: application/octet-stream" \
            "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
            > tauri-update/latest.json
          node .github/scripts/normalize-tauri-update.mjs \
            --manifest tauri-update/latest.json \
            --release tauri-update/release.json \
            --repository "${GITHUB_REPOSITORY}" \
            --version "${VERSION}"

      - name: Upload normalized Tauri updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: gh release upload "v${VERSION}" tauri-update/latest.json --clobber

      - name: Upload legacy updater assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: gh release upload "v${VERSION}" legacy-update/* --clobber

      - name: Publish the completed release
        if: needs.prepare.outputs.publish_mode == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: gh release edit "v${VERSION}" --draft=false --latest

      - name: Summary (draft kept)
        if: needs.prepare.outputs.publish_mode == 'draft'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          {
            echo "### Draft release v${VERSION} is ready"
            echo ""
            echo "Open https://github.com/${GITHUB_REPOSITORY}/releases and press **Publish release** when you want users to receive it."
            echo ""
            echo "The auto-updater only sees published releases, so nothing ships until you publish."
          } >> "${GITHUB_STEP_SUMMARY}"
